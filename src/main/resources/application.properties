#puerto del servidor
server.port=8080
spring.application.name=bancobienestar

#configuracion de thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=html
spring.thymeleaf.encoding=UTF-8

#configuracion de base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/bienestar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#conficugarion de hibernate/ JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
