<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Panel de Abono', ~{::section})}">
<head>
    <title>Panel de Abono</title>
</head>
<body>
<section>

    
  
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Abono al crédito</h4>
    </div>
 
    <div class="row">

        <!-- Formulario de abono -->
        <div class="col-12 col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <strong>Registrar abono</strong>
                </div>
                <div class="card-body">
                    <form novalidate>
 
                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto a abonar</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0.01" class="form-control"
                                       id="monto" name="monto" placeholder="0.00" required autofocus />
                            </div>
                            <div class="form-text">Saldo actual: $6,500.00</div>
                        </div>
 
                        <div class="mb-3">
                            <div class="form-text">
                                <i class="bi bi-calendar-check"></i>
                                Fecha de Abono, 27/07/2026.
                            </div>
                        </div>
 
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Registrar abono
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
 
        <!-- Resumen del crédito -->
        <div class="col-12 col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <strong>Resumen del crédito</strong>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-6">Cliente</dt>
                        <dd class="col-6">Juan Pérez</dd>
 
                        <dt class="col-6">Monto original</dt>
                        <dd class="col-6">$10,000.00</dd>
 
                        <dt class="col-6">Saldo actual</dt>
                        <dd class="col-6 fw-bold text-danger">$6,500.00</dd>
 
                    </dl>
                </div>
            </div>
        </div>
 
        
    </div>
  
</section>
</body>
</html>
