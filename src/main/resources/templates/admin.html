<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Panel Administrador Ejecutivo', ~{::section})}">
<head>
    <title>Panel Ejecutivo</title>
</head>
<body>
    <section>
        <!-- seccion para alertas de error -->
        <div th:if="${param.success}"
             class="alert alert--custom-success d-flex align-items-center gap-2 mb-5"
             role="alert">
            <i class="fa-solid fa-circle-check fs-5"></i>
            <div th:text="${param.success}">Operacion exitosa</div>
        </div>

        <div th:if="${param.error}"
             class="alert alert--custom-danger d-flex align-items-center gap-2 mb-5"
             role="alert">
            <i class="fa-solid fa-triangle-exclamation fs-5"></i>
            <div th:text="${param.error}">Error en la operacion</div>
        </div>

        <!-- Titulo y encabezado del ejecutivo -->
        <div class="row align-items-center mb-5">
            <div class="col-12 col-md-8">
                <h2 class="display-6 fw-bold text-white mb-2">
                    Panel Administrador
                </h2>
                <p class="text-white-50 mb-0">
                    Gestion de cartera de clientes,
                    apertura de cuentas y administracion de creditos.
                </p>
            </div>
            
            
            <div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img th:src="@{/imagen/registro.png}" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">CLIENTES REGISTRADOS</h5>
        <p class="card-text" th:text="${#lists.size(clientes)}"></p>
        <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
      </div>
    </div>
  </div>
</div>

<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img th:src="@{/imagen/credito.jpg}"  class="img-fluid rounded-start"  alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">SOLICITUDES DE CREDITO</h5>
        <p class="card-text" th:text="${#lists.size(solicitudes)}"></p>
        <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
      </div>
    </div>
  </div>
</div>
        </div>
        <div class="row">
           

            <div>
              <h3 class="text-white mb-3">Ultimos clientes registrados</h3>
              <table class="table table-striped table-hover">
                <thead>
                  <tr>
                    
                    <th scope="col">Usuario</th>
                    <th scope="col">CLABE</th>
                    <th scope="col">Saldo</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="cli : ${clientes}">
                    <td th:text="${cli.nombre}"></td>
                    <td th:if="${not #lists.isEmpty(cli.cuentas)}" th:text="${cli.cuentas[0].clabe}"></td>
                    <td th:text="${#numbers.formatDecimal(cli.cuentas[0].saldo, 1, 'COMMA', 2, 'POINT')}"></td>
                  </tr>
                </tbody>
              </table>
            </div>

           
    </section>
</body>
</html>
