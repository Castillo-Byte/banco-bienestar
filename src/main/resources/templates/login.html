<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="card">
      <div class="side">
        <div class="side-logo">
          <div class="side-icon">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10 1L2 6v1h16V6L10 1zm-8 7v8h3v-6h2v6h2v-6h2v6h2v-6h2v6h3V8H2zm9 0H9v1h2V8z"/>
            </svg>
          </div>
          <div>
            <div class="side-name">Banco Bienestar</div>
            <div class="side-tag">Banca en linea</div>
          </div>
        </div>

        <ul class="side-features">
          <li><i class="ti ti-clock-24" aria-hidden="true"></i> Disponible 24/7</li>
          <li><i class="ti ti-transfer" aria-hidden="true"></i> Transferencias</li>
          <li><i class="ti ti-headset" aria-hidden="true"></i> Soporte en linea</li>
        </ul>

        <div class="side-copy">&copy; 2026 Banco Bienestar S.A. de C.V.</div>
      </div>

      <form class="form-panel needs-validation" th:action="@{/login}" method="post">
        <h1 class="form-title">Bienvenido de nuevo</h1>
        <p class="form-sub">No tienes cuenta? <a href="#">Abre una aqui</a></p>

        <div class="field">
          <label for="usuario">Numero de cliente o usuario</label>
          <div class="input-wrap">
            <i class="ti ti-user lead" aria-hidden="true"></i>
            <input type="text" id="usuario" name="username" placeholder="Ej. 0001234567" required >
          </div>
        </div>

        <div class="field">
          <label for="contrasena">Contrasena</label>
          <div class="input-wrap">
            <i class="ti ti-lock lead" aria-hidden="true"></i>
            <input type="password" id="password" name="password" placeholder="********" required>
            <button class="trail" type="button" aria-label="Mostrar contrasena">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button class="btn-login" type="submit">
          <i class="ti ti-login" aria-hidden="true"></i> Ingresar
        </button>
      </form>
    </div>
  </div>
  <div th:if="${param.error}" class="alert alert-custom-danger d-flex align-items-center gap-2 mb-4" role="alert">
    <i class="fa-solid fa-circle-exclamation fs-5"></i>
    <div>Usuario o contraseña incorrectos. Por favor, verifica tus datos</div>
  </div>
  <div th:if="${param.logout}" class="alert alert-custom-success d-flex align-items-center gap-2 mb-4" role="alert">
    <i class="fa-solid fa-circle-check fs-5"></i>
    <div> sesión cerrada correctamente</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
