<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Transferencia', content=~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia</title>
</head>
<body>

<section class="wrap">

  <div class="mb-5">
    <h2 class="display-6 fw-bold text-white mb-2">
      <i class="fa-solid fa-paper-plane text-gradiante me-2"></i> Nueva Transferencias</h2>
    <p class="text-white">Realiza transferencias a otras cuentas de manera rápida y segura.</p>
  </div>

  <div th:if="${param.error}" class="alert alert-custom-danger d-flex align-items-center gap-2 mb-4" role="alert">
    <i class="fa-solid fa-triangle-exclamation fs-5"></i>
    <div th:text="${param.error}">Error en la operación</div>
  </div>

  <div th:if="${param.exito}" class="alert alert-custom-success d-flex align-items-center gap-2 mb-4" role="alert">
    <i class="fa-solid fa-circle-check fs-5"></i>
    <div th:text="${param.exito}">Operación exitosa</div>
  </div>

  <div class="grid">

    <!-- Formulario -->
    <div class="card">
      <div class="card-hd">
        <i class="ti ti-transfer" aria-hidden="true"></i> Nueva transferencia
      </div>

      <form th:action="@{/procesar-transferencia}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Cuenta origen (informativa, no editable: el controller usa la cuenta principal del usuario) -->
        <div class="acc-label">Cuenta origen</div>
        <div class="acc-row">
          <div class="acc-chip sel">
            <i class="ti ti-credit-card" aria-hidden="true"></i>
            <div>
              <div class="acc-chip-name">Cuenta</div>
              <div class="acc-chip-sub">
                •••• <span id="r-origen-suf" th:text="${cuentaClabe != null and cuentaClabe.length() >= 4} ? ${#strings.substring(cuentaClabe, cuentaClabe.length() - 4)} : '----'">4821</span>
              </div>
            </div>
            <div class="acc-chip-bal">
              <span th:text="${'$' + #numbers.formatDecimal(saldoTotal, 1, 'COMMA', 2, 'POINT')}">$48,250.00</span>
              <small>MXN</small>
            </div>
          </div>
        </div>

        <div class="fg">

          <!-- CLABE destino: el name debe llamarse clabeDestino, así lo lee el controller -->
          <div class="f full">
            <label for="clabeDestino">CLABE destino (CLABE de 18 dígitos)</label>
            <input type="text" id="clabeDestino" name="clabeDestino"
                   placeholder="000000000000000000" maxlength="18"
                   pattern="\d{18}" required
                   oninput="this.value=this.value.replace(/\D/g,''); sync()" />
          </div>

          <!-- Monto -->
          <div class="f full">
            <label for="monto">Monto a transferir($)</label>
            <div class="imp-wrap">
              <span class="sym">$</span>
              <input type="number" id="monto" name="monto"
                     placeholder="0.00" min="0.01" step="0.01" required
                     oninput="sync()" />
            </div>
          </div>

          <!-- Descripción -->
          <div class="f full">
            <label for="descripcion">Concepto de Pago</label>
            <input type="text" id="descripcion" name="descripcion"
                   placeholder="Ej. Pago de renta" maxlength="140" />
          </div>

        </div>

        <button type="submit" class="btn-send">
          <i class="ti ti-send" aria-hidden="true"></i> Enviar transferencia
        </button>

      </form>
    </div>

    <!-- Resumen -->
    <div class="card">
      <div class="card-hd">
        <i class="ti ti-receipt" aria-hidden="true"></i> Resumen
      </div>
      <div class="res-row">
        <span class="res-lbl">Cuenta origen</span>
        <span class="res-val">
          ••••<span th:text="${cuentaClabe != null and cuentaClabe.length() >= 4} ? ${#strings.substring(cuentaClabe, cuentaClabe.length() - 4)} : '----'">4821</span>
        </span>
      </div>
      <div class="res-row">
        <span class="res-lbl">CLABE destino</span>
        <span class="res-val" id="r-destino">—</span>
      </div>
      <div class="res-row">
        <span class="res-lbl">Concepto</span>
        <span class="res-val" id="r-desc">—</span>
      </div>
      <div class="res-row res-divider">
        <span class="res-lbl" style="font-size:13px;color:#A8BDD1;">Total</span>
        <span class="res-val res-total" id="r-total">$0.00 MXN</span>
      </div>
    </div>

  </div>

  <script>
    function sync() {
      const destino = document.getElementById('clabeDestino')?.value || '';
      const monto = parseFloat(document.getElementById('monto')?.value || '0');
      const descripcion = document.getElementById('descripcion')?.value || '';

      document.getElementById('r-destino').textContent = destino || '—';
      document.getElementById('r-desc').textContent = descripcion || '—';
      document.getElementById('r-total').textContent = '$' + monto.toLocaleString('es-MX', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' MXN';
    }
  </script>

</section>

</body>
</html>
